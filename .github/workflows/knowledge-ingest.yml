name: Knowledge Ingest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD~1 for diff

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run tests with coverage
        id: tests
        run: |
          go test -race ./... -coverprofile=cover.out -count=1 2>&1 | tee /tmp/test.log
          exit ${PIPESTATUS[0]}

      - name: Check coverage threshold
        id: coverage
        run: |
          TOTAL=$(go tool cover -func=cover.out | awk '/^total:/{gsub(/%/,"",$3); print int($3)}')
          echo "Total coverage: ${TOTAL}%"
          echo "pct=${TOTAL}" >> "$GITHUB_OUTPUT"
          if [ "${TOTAL}" -lt 50 ]; then
            echo "::error::Coverage ${TOTAL}% is below minimum threshold of 50%"
            exit 1
          fi

      - name: PR coverage comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- coverage-comment -->';
            const pct = '${{ steps.coverage.outputs.pct }}';
            const threshold = 50;
            let body;
            if (pct === '') {
              body = MARKER + '\n### 📊 Go coverage\ncoverage 計測に失敗しました（Check coverage threshold ステップ未到達）';
            } else {
              const status = Number(pct) >= threshold ? '✅' : '❌';
              body = MARKER + '\n### 📊 Go coverage: **' + pct + '%** ' + status + '\n\n閾値: ' + threshold + '%';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          retention-days: 7

  ingest:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name == 'push' && vars.LLMO_TRIGGER_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download test log
        uses: actions/download-artifact@v4
        with:
          name: test-log
          path: /tmp

      - name: Build diff + CI log payload
        id: payload
        run: |
          DIFF=$(git diff HEAD~1 HEAD -- '*.go' | head -c 32768)
          COMMIT_SHA=${{ github.sha }}
          CI_LOG=$(tail -c 8192 /tmp/test.log 2>/dev/null || echo "")
          # Emit as escaped JSON string via file to avoid shell quoting issues
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg diff "$DIFF" \
            --arg ci_log "$CI_LOG" \
            '{"commit_sha": $sha, "diff": $diff, "ci_log": $ci_log}' > /tmp/trigger_payload.json
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: POST /v1/trigger
        run: |
          curl -sf -X POST "${{ vars.LLMO_TRIGGER_URL }}/v1/trigger" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.LLMO_TRIGGER_TOKEN }}" \
            --data @/tmp/trigger_payload.json \
            --max-time 10 \
          && echo "trigger accepted for ${{ steps.payload.outputs.sha }}" \
          || echo "trigger failed (non-fatal)"
        continue-on-error: true
