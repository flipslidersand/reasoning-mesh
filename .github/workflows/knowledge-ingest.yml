name: Knowledge Ingest

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD~1 for diff

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests with coverage
        id: tests
        run: |
          go test -race ./... -coverprofile=cover.out -count=1 2>&1 | tee /tmp/test.log
          exit ${PIPESTATUS[0]}

      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=cover.out | awk '/^total:/{gsub(/%/,"",$3); print int($3)}')
          echo "Total coverage: ${TOTAL}%"
          if [ "${TOTAL}" -lt 40 ]; then
            echo "::error::Coverage ${TOTAL}% is below minimum threshold of 40%"
            exit 1
          fi

      - name: Check coverage threshold
        run: |
          go test ./... -coverprofile=cover.out -count=1 2>/dev/null
          TOTAL=$(go tool cover -func=cover.out | awk '/^total:/{gsub(/%/,"",$3); print int($3)}')
          echo "Total coverage: ${TOTAL}%"
          if [ "${TOTAL}" -lt 30 ]; then
            echo "::error::Coverage ${TOTAL}% is below minimum threshold of 30%"
            exit 1
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          retention-days: 7

  ingest:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ success() && vars.LLMO_TRIGGER_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download test log
        uses: actions/download-artifact@v4
        with:
          name: test-log
          path: /tmp

      - name: Build diff + CI log payload
        id: payload
        run: |
          DIFF=$(git diff HEAD~1 HEAD -- '*.go' | head -c 32768)
          COMMIT_SHA=${{ github.sha }}
          CI_LOG=$(tail -c 8192 /tmp/test.log 2>/dev/null || echo "")
          # Emit as escaped JSON string via file to avoid shell quoting issues
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg diff "$DIFF" \
            --arg ci_log "$CI_LOG" \
            '{"commit_sha": $sha, "diff": $diff, "ci_log": $ci_log}' > /tmp/trigger_payload.json
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: POST /v1/trigger
        run: |
          curl -sf -X POST "${{ vars.LLMO_TRIGGER_URL }}/v1/trigger" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.LLMO_TRIGGER_TOKEN }}" \
            --data @/tmp/trigger_payload.json \
            --max-time 10 \
          && echo "trigger accepted for ${{ steps.payload.outputs.sha }}" \
          || echo "trigger failed (non-fatal)"
        continue-on-error: true
